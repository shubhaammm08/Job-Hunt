name: "Inbox Assistant 4-Hour Autonomous Briefing"

on:
  schedule:
    # Every 4 hours at 02:17, 06:17, 10:17, 14:17, 18:17, 22:17 IST.
    # Converted to UTC cron:
    - cron: "47 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force process latest emails regardless of last seen message ID"
        type: boolean
        required: false
        default: false

concurrency:
  group: inbox-assistant-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inbox_summary:
    name: "Summarize & Brief Inbox"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Restore State from state/inbox branch"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          echo "=== Fetching persistent state from state/inbox branch ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git ls-remote --heads origin state/inbox | grep -q state/inbox; then
            echo "Branch 'state/inbox' found on remote. Fetching state..."
            git fetch origin state/inbox --depth=1
            
            if git show origin/state/inbox:summary_seen.json > out/summary_seen.json.tmp 2>/dev/null && [ -s out/summary_seen.json.tmp ]; then
              if python -c "import json; d=json.load(open('out/summary_seen.json.tmp', encoding='utf-8')); assert isinstance(d, dict) and 'last_seen_id' in d"; then
                mv out/summary_seen.json.tmp out/summary_seen.json
                LAST_ID=$(python -c "import json; print(json.load(open('out/summary_seen.json', encoding='utf-8')).get('last_seen_id', 0))")
                echo "Successfully restored out/summary_seen.json (last_seen_id: $LAST_ID)."
                echo "PRE_SEEN_ID=$LAST_ID" >> "$GITHUB_ENV"
              else
                echo "::warning::Corrupted summary_seen.json found on branch. Discarding."
                rm -f out/summary_seen.json.tmp
                echo "PRE_SEEN_ID=0" >> "$GITHUB_ENV"
              fi
            else
              rm -f out/summary_seen.json.tmp
              echo "PRE_SEEN_ID=0" >> "$GITHUB_ENV"
            fi
          else
            echo "Branch 'state/inbox' does not exist yet. Initial run will scan latest inbound emails."
            echo "PRE_SEEN_ID=0" >> "$GITHUB_ENV"
          fi

      - name: "Execute Inbox Assistant"
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.GMAIL_EMAIL || secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.GMAIL_APP_PASSWORD || secrets.SMTP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO || secrets.GMAIL_EMAIL || secrets.SMTP_USER }}
        run: |
          CMD="python mail_summarizer.py"
          if [ "${{ inputs.force }}" = "true" ]; then
            CMD="$CMD --force"
            echo "Force flag enabled: Processing latest incoming emails regardless of state."
          fi
          
          echo "Running inbox assistant: $CMD"
          eval $CMD

      - name: "Commit & Push State to state/inbox"
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Persisting state to state/inbox ==="
          if [ ! -f out/summary_seen.json ] || [ ! -s out/summary_seen.json ]; then
            echo "No out/summary_seen.json found or file empty (zero new emails in period). Skipping push."
            exit 0
          fi
          
          # Anti-Wipe Validation Gate: Validate last_seen_id monotonicity
          python -c "
          import json, os, sys
          try:
              data = json.load(open('out/summary_seen.json', encoding='utf-8'))
              assert isinstance(data, dict) and 'last_seen_id' in data, 'Invalid state schema'
              new_id = int(data.get('last_seen_id', 0))
          except Exception as e:
              print(f'::error::Invalid summary_seen.json: {e}')
              sys.exit(1)
          
          pre_id = int(os.environ.get('PRE_SEEN_ID', 0))
          print(f'Inbox state verification: pre_id={pre_id}, post_id={new_id}')
          if new_id < pre_id:
              print(f'::error::Regressed last_seen_id ({new_id} < {pre_id})! Aborting state commit.')
              sys.exit(1)
          "
          
          STATE_DIR="$(mktemp -d)"
          cd "$STATE_DIR"
          
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git remote add origin "$REPO_URL"
          
          PUSHED=false
          for i in 1 2 3; do
            echo "State push attempt $i..."
            if git ls-remote --heads origin state/inbox | grep -q state/inbox; then
              git fetch origin state/inbox --depth=1
              git checkout -B state/inbox origin/state/inbox
            else
              git checkout --orphan state/inbox
            fi
            
            # If concurrent update occurred, merge highest last_seen_id
            if [ -f summary_seen.json ] && [ "$i" -gt 1 ]; then
              python -c "
              import json
              with open('summary_seen.json', 'r', encoding='utf-8') as f:
                  remote_data = json.load(f)
              with open('$GITHUB_WORKSPACE/out/summary_seen.json', 'r', encoding='utf-8') as f:
                  local_data = json.load(f)
              merged_id = max(int(remote_data.get('last_seen_id', 0)), int(local_data.get('last_seen_id', 0)))
              merged = {
                  'last_seen_id': merged_id,
                  'updated_at': local_data.get('updated_at', remote_data.get('updated_at'))
              }
              with open('summary_seen.json', 'w', encoding='utf-8') as f:
                  json.dump(merged, f, indent=2)
              "
            else
              cp "$GITHUB_WORKSPACE/out/summary_seen.json" ./summary_seen.json
            fi
            
            git add summary_seen.json
            if git diff --staged --quiet; then
              echo "No inbox state changes to commit."
              PUSHED=true
              break
            fi
            
            git commit -m "Auto-update inbox assistant state [run #${{ github.run_number }}] [skip ci]"
            
            if git push origin state/inbox; then
              echo "State successfully pushed to branch state/inbox."
              PUSHED=true
              break
            else
              echo "Push rejected due to remote change. Retrying in 3 seconds..."
              sleep 3
              git reset --hard HEAD
            fi
          done
          
          cd "$GITHUB_WORKSPACE"
          rm -rf "$STATE_DIR"
          
          if [ "$PUSHED" != "true" ]; then
            echo "::error::Failed to persist state to state/inbox after 3 attempts."
            exit 1
          fi

      - name: "Upload Artifacts (Briefing & Log)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inbox-assistant-artifacts-${{ github.run_number }}
          path: |
            out/last_briefing.html
            out/mail_summary.log
          retention-days: 7
          if-no-files-found: ignore

      - name: "Publish GitHub Step Summary"
        if: always()
        run: |
          echo "## 📬 Inbox Assistant Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number**: \`#${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f out/summary_seen.json ]; then
            LAST_ID=$(python -c "import json; print(json.load(open('out/summary_seen.json', encoding='utf-8')).get('last_seen_id', 'N/A'))" 2>/dev/null || echo "N/A")
            echo "- **Last Processed Email ID**: \`$LAST_ID\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f out/last_briefing.html ]; then
            echo "- **HTML Briefing**: Generated & delivered (available in run artifacts)" >> $GITHUB_STEP_SUMMARY
          fi
