name: "JobHunter Daily Autonomous Pipeline"

on:
  schedule:
    # Daily at 9:00 AM IST (03:30 UTC)
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate digest & tracker without sending email)"
        type: boolean
        required: false
        default: false
      limit:
        description: "Max candidate jobs to screen/draft (leave empty for full run)"
        type: string
        required: false
        default: ""
      scorer:
        description: "Scoring method to use (llm for production, keyword for offline testing)"
        type: choice
        options:
          - llm
          - keyword
        default: llm
        required: false

concurrency:
  group: jobhunt-engine-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  jobhunt:
    name: "Execute Daily Job Hunter"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Configure Profile Data"
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          if [ -n "$PROFILE_JSON" ]; then
            echo "Constructing profile.json from GitHub Secrets (PROFILE_JSON)..."
            printf '%s' "$PROFILE_JSON" > profile.json
            python -c "import json; data=json.load(open('profile.json')); print(f'Loaded profile for: {data.get(\"name\", \"Candidate\")}')"
          elif [ -f profile.json ]; then
            echo "Using existing profile.json found in repository workspace..."
          elif [ -f profile.example.json ]; then
            echo "::warning::PROFILE_JSON secret not configured. Falling back to profile.example.json"
            cp profile.example.json profile.json
          else
            echo "::error::No profile.json or PROFILE_JSON secret found. Cannot proceed."
            exit 1
          fi

      - name: "Restore State from state/jobhunter branch"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          echo "=== Fetching persistent state from state/jobhunter branch ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git ls-remote --heads origin state/jobhunter | grep -q state/jobhunter; then
            echo "Branch 'state/jobhunter' found on remote. Fetching state..."
            git fetch origin state/jobhunter --depth=1
            
            # Extract and validate seen.json
            if git show origin/state/jobhunter:seen.json > seen.json.tmp 2>/dev/null && [ -s seen.json.tmp ]; then
              # Defensive encoding normalization (handles cp1252 to utf-8 conversion if needed)
              python -c "
              import json
              try:
                  content = open('seen.json.tmp', 'r', encoding='utf-8').read()
                  d = json.loads(content)
              except UnicodeDecodeError:
                  content = open('seen.json.tmp', 'r', encoding='cp1252', errors='replace').read()
                  d = json.loads(content)
                  with open('seen.json.tmp', 'w', encoding='utf-8') as f:
                      json.dump(d, f, indent=2, ensure_ascii=False)
              assert isinstance(d, dict)
              " 2>/dev/null
              
              if [ $? -eq 0 ]; then
                mv seen.json.tmp seen.json
                SEEN_COUNT=$(python -c "import json; print(len(json.load(open('seen.json', encoding='utf-8'))))")
                echo "Successfully restored seen.json with $SEEN_COUNT previously seen postings."
                echo "PRE_RUN_COUNT=$SEEN_COUNT" >> "$GITHUB_ENV"
              else
                echo "::warning::seen.json on state/jobhunter is corrupted. Initializing clean dedupe table."
                rm -f seen.json.tmp
                echo "{}" > seen.json
                echo "PRE_RUN_COUNT=0" >> "$GITHUB_ENV"
              fi
            else
              rm -f seen.json.tmp
              echo "{}" > seen.json
              echo "PRE_RUN_COUNT=0" >> "$GITHUB_ENV"
            fi
            
            # Extract out/tracker.csv
            if git show origin/state/jobhunter:tracker.csv > out/tracker.csv.tmp 2>/dev/null && [ -s out/tracker.csv.tmp ]; then
              mv out/tracker.csv.tmp out/tracker.csv
              echo "Successfully restored out/tracker.csv ($(wc -l < out/tracker.csv) rows)."
            else
              rm -f out/tracker.csv.tmp
            fi
          else
            echo "Branch 'state/jobhunter' does not exist yet. Initializing clean state."
            echo "{}" > seen.json
            echo "PRE_RUN_COUNT=0" >> "$GITHUB_ENV"
          fi

      - name: "Execute JobHunter Pipeline"
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          SCREEN_PROVIDER: ${{ vars.SCREEN_PROVIDER }}
          DRAFT_PROVIDER: ${{ vars.DRAFT_PROVIDER }}
          SCREEN_MODEL: ${{ vars.SCREEN_MODEL || 'gemini-2.5-flash-lite' }}
          DRAFT_MODEL: ${{ vars.DRAFT_MODEL || 'gemini-2.5-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.GMAIL_EMAIL || secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.GMAIL_APP_PASSWORD || secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO || secrets.GMAIL_EMAIL || secrets.SMTP_USER }}
        run: |
          CMD="python -m jobhunt run"
          
          # Handle dry_run input
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            CMD="$CMD --send"
          else
            echo "Dry run enabled: Email delivery will be skipped."
          fi
          
          # Handle candidate limit input
          if [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            CMD="$CMD --limit ${{ inputs.limit }}"
          fi
          
          # Handle scorer choice input
          if [ "${{ inputs.scorer }}" = "keyword" ]; then
            CMD="$CMD --scorer keyword"
          fi
          
          echo "Executing pipeline: $CMD"
          eval $CMD

      - name: "Commit & Push State to state/jobhunter"
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Persisting state to state/jobhunter ==="
          if [ ! -f seen.json ] || [ ! -s seen.json ]; then
            echo "::error::seen.json is missing or zero-byte! Skipping push to protect historical state."
            exit 1
          fi
          
          # Anti-Wipe Validation Gate: Validate JSON integrity and non-shrinkage invariant
          python -c "
          import json, os, sys
          try:
              data = json.load(open('seen.json', encoding='utf-8'))
              assert isinstance(data, dict), 'seen.json must be a JSON dictionary'
          except Exception as e:
              print(f'::error::Invalid seen.json integrity: {e}')
              sys.exit(1)
          
          pre_count = int(os.environ.get('PRE_RUN_COUNT', 0))
          post_count = len(data)
          print(f'State verification: pre-run entries={pre_count}, post-run entries={post_count}')
          if post_count < pre_count:
              print(f'::error::State wipe detected! Count decreased from {pre_count} to {post_count}. Aborting commit.')
              sys.exit(1)
          print(f'Validated seen.json integrity: {post_count} records verified.')
          "
          
          STATE_DIR="$(mktemp -d)"
          cd "$STATE_DIR"
          
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git remote add origin "$REPO_URL"
          
          # Resilient push loop with semantic dictionary merge on push conflicts
          PUSHED=false
          for i in 1 2 3; do
            echo "State push attempt $i..."
            if git ls-remote --heads origin state/jobhunter | grep -q state/jobhunter; then
              git fetch origin state/jobhunter --depth=1
              git checkout -B state/jobhunter origin/state/jobhunter
            else
              git checkout --orphan state/jobhunter
            fi
            
            # If remote already has seen.json, perform semantic merge with local run output
            if [ -f seen.json ] && [ "$i" -gt 1 ]; then
              python -c "
              import json, csv
              with open('seen.json', 'r', encoding='utf-8') as f:
                  remote_data = json.load(f)
              with open('$GITHUB_WORKSPACE/seen.json', 'r', encoding='utf-8') as f:
                  local_data = json.load(f)
              merged = {**remote_data, **local_data}
              with open('seen.json', 'w', encoding='utf-8') as f:
                  json.dump(merged, f, indent=2, ensure_ascii=False)
              cols = ['first_seen', 'company', 'title', 'location', 'canonical_source',
                      'sources', 'role_families', 'score', 'reason', 'applied', 'applied_on', 'url']
              with open('tracker.csv', 'w', newline='', encoding='utf-8') as fh:
                  w = csv.DictWriter(fh, fieldnames=['job_id'] + cols, extrasaction='ignore')
                  w.writeheader()
                  for jid, row in sorted(merged.items(), key=lambda kv: kv[1].get('first_seen', ''), reverse=True):
                      w.writerow({'job_id': jid, **row})
              "
            else
              cp "$GITHUB_WORKSPACE/seen.json" ./seen.json
              if [ -f "$GITHUB_WORKSPACE/out/tracker.csv" ]; then
                cp "$GITHUB_WORKSPACE/out/tracker.csv" ./tracker.csv
              fi
            fi
            
            git add seen.json tracker.csv
            if git diff --staged --quiet; then
              echo "No state changes to commit."
              PUSHED=true
              break
            fi
            
            git commit -m "Auto-update jobhunter state [run #${{ github.run_number }}] [skip ci]"
            
            if git push origin state/jobhunter; then
              echo "State successfully pushed to branch state/jobhunter."
              PUSHED=true
              break
            else
              echo "Push rejected due to remote change. Retrying in 3 seconds..."
              sleep 3
              git reset --hard HEAD
            fi
          done
          
          cd "$GITHUB_WORKSPACE"
          rm -rf "$STATE_DIR"
          
          if [ "$PUSHED" != "true" ]; then
            echo "::error::Failed to persist state to state/jobhunter after 3 attempts."
            exit 1
          fi

      - name: "Upload Artifacts (Digest & Tracker)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobhunter-artifacts-${{ github.run_number }}
          path: |
            out/digest.html
            out/tracker.csv
            out/source_health.json
          retention-days: 14
          if-no-files-found: ignore

      - name: "Publish GitHub Step Summary"
        if: always()
        run: |
          echo "## 📊 JobHunter Daily Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number**: \`#${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f seen.json ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('seen.json', encoding='utf-8'))))" 2>/dev/null || echo "Unknown")
            echo "- **Cumulative Seen Postings**: \`$COUNT\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f out/digest.html ]; then
            echo "- **HTML Digest**: Generated successfully (saved in run artifacts)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f out/tracker.csv ]; then
            LINES=$(wc -l < out/tracker.csv 2>/dev/null || echo "0")
            echo "- **Application Tracker**: \`$LINES\` entries on record" >> $GITHUB_STEP_SUMMARY
          fi
