filters:
  include_titles:
    # --- Data Analytics & Business Intelligence track ---
    - '\bdata\s+analyst\b'
    - '\bbusiness\s+intelligence\b'
    - '\bbi\s+analyst\b'
    - '\b(data|business|reporting|bi)\s+analytics\b'
    - '\bproduct\s+analyst\b'
    - '\banalytics\s+engineer\b'
    - '\bquantitative\s+analyst\b'

    # --- AI, Machine Learning & Python track ---
    - '\b(ai|ml|machine\s+learning)\s+engineer\b'
    - '\b(ai|ml|machine\s+learning)\s+developer\b'
    - '\bpython\s+(developer|engineer)\b'
    - '\bprompt\s+engineer\b'
    - '\bai\s+specialist\b'

    # --- Data Engineering & ETL track ---
    - '\bdata\s+engineer\b'
    - '\betl\s+(developer|engineer)\b'

    # --- Software & Systems Engineering track ---
    - '\b(software|backend|back-end|server|platform|infrastructure|infra|systems|distributed|cloud)\b.*\bengineer\b'
    - '\bengineer\b.*\b(backend|back-end|platform|infrastructure|infra|systems|distributed)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - 'software development engineer'
    - 'software engineer'
    - 'site reliability engineer'
    - '\bsre\b'
    - 'member of technical staff'
    - '\bnetwork(ing)?\s+(software\s+)?engineer\b'
    - '\b(kernel|embedded|firmware|driver|packet|dataplane|data plane)\b.*\bengineer\b'
    - '\bengineer\b.*\b(kernel|packet|dataplane|networking|performance)\b'
    - '\bperformance engineer\b'
    - '\bsystems engineer\b'
    - '\bc\+\+\b.*\bengineer\b'
    - '\bengineer\b.*\bc\+\+\b'
    - '\bassociate\s+software\s+engineer\b'
    - '\bgraduate\s+engineer\b'
    - '\bjunior\s+(software|data|python|ai)\b'

    # --- Full-Stack & Frontend track ---
    - '\bfull[-\s]?stack\b'
    - '\breact\b'

    # --- Mobile Development track ---
    - '\bmobile\s+(developer|engineer)\b'
    - '\bflutter\b'

    # --- API & Backend track ---
    - '\b(fastapi|flask|rest\s+apis?)\b'
    - '\bbackend\s+(developer|engineer)\b'

    # --- Automation & Workflow track ---
    - '\b(automation|workflow\s+automation)\s+(engineer|developer)\b'
    - '\bn8n\b'

  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\b(sr\.?|senior)\b'
    - '\b(team\s+lead|lead|tech\s+lead)\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(frontend|front-end|designer|game)\b'

  locations:
    - mumbai
    - powai
    - pune
    - bangalore
    - bengaluru
    - hyderabad
    - gurgaon
    - noida
    - delhi
    - chennai
    - worldwide
    - india
    # 'remote' is fully supported via allow_remote: true below (and in sources.linkedin.locations)

  allow_remote: true
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 6.0      # minimum match score (0-10) to draft and digest
max_per_digest: 0         # maximum jobs drafted and presented in digest (0 for all qualifying fresh opportunities; minimum 10 when available)

# --- notifications ----------------------------------------------------------
notifications:
  whatsapp:
    enabled: true
    min_score: 6.0          # Only alert jobs matching or exceeding this score
    max_jobs_per_alert: 5   # Top N best matches to prevent WhatsApp message bloat
    provider: callmebot     # callmebot (free, recommended), twilio, or webhook

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
source_health_file: out/source_health.json

# --- sources configuration --------------------------------------------------
sources:
  linkedin:
    # Enabled with dummy/throwaway account session (session.json)
    enabled: true
    session_file: "session.json"
    headless: true
    rate_limit_delay: 2.0
    max_pages_per_search: 2
    limit_per_search: 15
    keywords:
      - "AI Engineer"
      - "GenAI Engineer"
      - "LLM Engineer"
      - "RAG Engineer"
      - "Data Analyst"
      - "Machine Learning Engineer"
      - "Python Developer"
    locations:
      - "India"
      - "Mumbai"
      - "Pune"
      - "Bangalore"
      - "Hyderabad"
      - "Delhi"
      - "Gurgaon"
      - "Noida"
      - "Chennai"
      - "Remote"

  weworkremotely:
    enabled: false
  flexjobs:
    enabled: false

  enabled_categories:
    - direct_ats
    - remote_sources
    - startup_sources
    - india_job_boards
    - global_job_boards
    - fresher_sources
    - ai_sources

  priority_tiers:
    tier_1: direct_ats
    tier_2: specialized_tech
    tier_3: aggregators
    tier_4: generic_boards

  rate_limits:
    direct_ats: 0.2
    aggregators: 0.5
    boards: 1.0

